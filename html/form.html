 <form method="get" autocomplete="on">
    <label>  Name:</label>
 <input type="text" placeholder="write your name">
 <br></br>

 <label> Email:</label>
 <input type="email" placeholder="write your email">
 <br></br>

 <label> Password:</label>
 <input type="password" placeholder="write your password" minlength="8" maxlength="20" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,20}$"
 title="Password must be 8-20 characters including both letters and numbers ">
 <br></br>

 <label> Age:</label>
 <input type="number" placeholder="write your age">
 <br></br>

 <label> Gender:</label>
 <input type="radio" name="gender" value="male"> Male
 <input type="radio" name="gender" value="female"> Female
 <br></br>

 <label> Country:</label>
 <select>
    <option value="India">India</option>
   <option value="usa">USA</option>
   <option value="canada">Canada</option>
   <option value="uk">UK</option>
 </select>
 <br></br>

 <label> Hobbies: </label>
 <input type="checkbox" name="hobbies" value="reading"> Reading
 <input type="checkbox" name="hobbies" value="writing"> Writing
 <input type="checkbox" name="hobbies" value="coding"> Coding
 <br></br>
